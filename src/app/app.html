<div class="shell" [class.menu-open]="menuOpen()">
  <!-- Mobil felső sáv -->
  <header class="topbar">
    <button
      type="button"
      class="menu-btn"
      aria-label="Menü megnyitása"
      aria-controls="sidebar"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      ☰
    </button>
    <span class="topbar-title">TeamFlow</span>
    <span class="avatar">KA</span>
  </header>

  <!-- Sötétített háttér nyitott menünél (mobil) -->
  <div class="backdrop" (click)="closeMenu()"></div>

  <!-- Oldalsáv -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo">T</span>
      <span class="brand-name">TeamFlow</span>
    </div>

    <div class="nav-label">MUNKATERÜLET</div>

    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeMenu()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-user">
      <span class="avatar">KA</span>
      <div>
        <div class="user-name">Kiss Anna</div>
        <div class="user-role">Csapattag</div>
      </div>
    </div>
  </aside>

  <!-- Oldal tartalma -->
  <main class="content">
    <router-outlet />
  </main>
</div>
