<h1>Projektek</h1>

<div class="project-list">
    @for (project of projects; track project.id) {
        <div class="project-card">
            <h2>{{project.name}}</h2>
            <p>{{project.description}}</p>
            <p>{{project.doDate}}</p>
            <p>{{project.startDate}}</p>
        </div>
    }
</div>
